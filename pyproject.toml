[project]
name = "frappe_otp_login"
authors = [
    { name = "Clearent", email = "dev@clearent.in" },
]
description = "Passwordless OTP login via email and SMS"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project.urls]
Homepage = "https://github.com/clearent/frappe_otp_login"
Repository = "https://github.com/clearent/frappe_otp_login.git"
"Bug Reports" = "https://github.com/clearent/frappe_otp_login/issues"

[tool.bench.frappe-dependencies]
frappe = ">=17.0.0-dev,<18.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.ruff.lint.isort.sections]
"frappe" = ["frappe"]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "frappe",
    "first-party",
    "local-folder",
]
